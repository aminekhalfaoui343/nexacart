services:
  postgres:
    image: postgres:17-alpine
    container_name: nexacart-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: nexacart
      POSTGRES_PASSWORD: nexacart_dev_password
      POSTGRES_DB: nexacart

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacart -d nexacart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

